name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catch newly disclosed vulnerabilities

permissions:
  contents: read

jobs:
  python:
    name: Lint, test & coverage (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest --cov --cov-fail-under=90

  frontend:
    name: Frontend unit tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --check static/app.js && node --check static/lib.js
      - run: node --test "tests/js/*.test.js"

  security:
    name: Dependency & code security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit ruff
      - name: Known-vulnerability audit of pinned dependencies
        run: pip-audit -r requirements.txt --strict
      - name: Static security lint (flake8-bandit rules)
        run: ruff check app --select S

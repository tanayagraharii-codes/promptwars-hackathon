# Cloud Build CI/CD: test → build → push → deploy to Cloud Run (Vertex AI, no API key).
# One-time setup is done by ./deploy.sh (service account, Firestore, APIs).
# Usage: gcloud builds submit --config cloudbuild.yaml
substitutions:
  _SERVICE: evidentia
  _REGION: us-central1
  _REPO: cloud-run-source-deploy

steps:
  - id: test
    name: python:3.12-slim
    entrypoint: sh
    args: ["-c", "pip install -q -r requirements-dev.txt && ruff check app tests && pytest"]

  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID", "."]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --service-account=${_SERVICE}-runner@$PROJECT_ID.iam.gserviceaccount.com
      - --allow-unauthenticated
      - --set-env-vars=FIRESTORE_ENABLED=true,SEARCH_BACKEND=auto,GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_REGION}
      - --memory=512Mi
      - --timeout=300
      - --concurrency=20
      - --max-instances=3

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
